server:
  port: 8081

spring:
  application:
    name: log-service
  datasource:
    url: jdbc:mysql://localhost:3306/log_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"
#  h2:
#    console:
#      enabled: true
#      path: /h2-console
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    # 生产者确认：CORRELATED模式，每条消息异步回调确认是否到达Broker
    publisher-confirm-type: correlated
    # 开启mandatory：无法路由到队列的消息触发ReturnCallback而非静默丢弃
    template:
      mandatory: true
    listener:
      simple:
        acknowledge-mode: manual
        # 每次只预取1条消息，防止消息在消费者缓冲区堆积超时
        prefetch: 1

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.logmonitor.common.entity
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
#    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

logging:
  level:
    com.logmonitor: debug
    com.baomidou.mybatisplus: debug

log:
  watch:
    directory: D:/zyjk/log-ai/logs
    poll-interval-ms: 500
