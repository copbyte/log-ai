server:
  port: 8081

spring:
  application:
    name: log-service
  datasource:
    url: jdbc:mysql://localhost:3306/log_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true
    # rewriteBatchedStatements=true: MySQL 驱动将批量 INSERT 合并为多值 INSERT，让 saveBatch 真正批量执行
    # driver-class-name 已删除：Spring Boot 可从 jdbc url 自动推断
    username: root
    password: "123456"

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.logmonitor.common.entity
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.logmonitor: debug
    com.baomidou.mybatisplus: debug

log:
  watch:
    # 监听目录（逗号分隔，支持多目录）
    # 示例：D:/zyjk/testlog,D:/my-project/logs
    directories: D:/zyjk/testlog
    poll-interval-ms: 500
    # 单部署建议开启：过滤监控平台自身组件日志，防止反馈循环
    # 多部署（监控与被监控分离）可关闭，完整采集自身日志
    filter-self-logs: true
    self-log-classes: com.logmonitor.log.service.impl.LogBatchProcessor,com.logmonitor.log.service.impl.FileWatchService
  # Syslog 采集（态势感知扩展，接收防火墙/IDS 等网络设备日志）
  syslog:
    enabled: true
    port: 5140
    buffer-size: 5000
  # 模拟安全日志生成器（面试演示用，生产环境关闭）
  simulator:
    enabled: true
