server:
  port: 8082

spring:
  application:
    name: mcp-server

  ai:
    # MCP Server 配置
    mcp:
      server:
        name: log-analysis-mcp-server
        version: 2.0.0
        type: SYNC
        protocol: SSE
        annotation-scanner:
          enabled: true

    # DeepSeek（兼容 OpenAI 协议）
    # API Key 通过环境变量 DEEPSEEK_API_KEY 注入，避免提交到仓库
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-flash
          temperature: 0.3

# log-service 地址
log-service:
  url: http://localhost:8081
  # 服务间调用令牌（与 log-service app.security.service-token 保持一致）
  token: ${LOG_SERVICE_TOKEN:service-token-demo}

logging:
  level:
    com.logmonitor.mcp: INFO
    org.springframework.ai: DEBUG

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: always
voice:
  # 注意：路径是相对"进程工作目录"解析的。
  # IDEA 里运行 mcp-server 时工作目录默认是项目根 D:\zyjk\log-ai，所以要用 ./mcp-server/models/...
  # 若在 mcp-server 目录下用命令行启动（mvn spring-boot:run），则改成 ./models/vosk-model-small-cn-0.22
  model-path: ./mcp-server/models/vosk-model-small-cn-0.22
  wake-word: 小日
