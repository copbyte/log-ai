server:
  port: 8082

spring:
  application:
    name: mcp-server

  ai:
    # MCP Server 配置
    mcp:
      server:
        name: log-analysis-mcp-server
        version: 2.0.0
        type: SYNC
        protocol: SSE
        annotation-scanner:
          enabled: true

    # DeepSeek（兼容 OpenAI 协议）
    # API Key 通过环境变量 DEEPSEEK_API_KEY 注入，避免提交到仓库
    openai:
      api-key: ${DEEPSEEK_API_KEY:sk-placeholder}
      base-url: https://api.deepseek.com
      chat:
        options:
          model: deepseek-v4-pro
          temperature: 0.7

# log-service 地址
log-service:
  url: http://localhost:8081

logging:
  level:
    com.logmonitor.mcp: INFO
    org.springframework.ai: DEBUG
