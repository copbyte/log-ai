server:
  port: 8080

spring:
  application:
    name: gateway
  cloud:
    gateway:
      routes:
        - id: log-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/log/**
        - id: ai-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/ai/**
        - id: alert-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/alert/**
        - id: log-websocket
          uri: http://localhost:8081
          predicates:
            - Path=/ws/log/**
        - id: alert-websocket
          uri: http://localhost:8083
          predicates:
            - Path=/ws/alert/**

jwt:
  secret: dev-secret-key-change-in-production-min-256-bits
  expiration: 86400000