server:
  port: 8082

spring:
  application:
    name: ai-service
  datasource:
    url: jdbc:mysql://localhost:3306/log_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"
  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 3000ms
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        acknowledge-mode: manual
        # 每次只预取1条消息，避免AI分析耗时导致消息在消费者缓冲区堆积
        prefetch: 1
        retry:
          # 启用Spring Retry拦截器，由容器层面处理重试，消费者只需关注业务逻辑
          enabled: true
          # 最多重试3次
          max-attempts: 3
          # 首次重试间隔1秒，后续按2倍递增（1s → 2s → 4s），最大间隔10秒
          initial-interval: 1000ms
          max-interval: 10000ms
          multiplier: 2

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

logging:
  level:
    com.logmonitor: debug
  config: classpath:logback.xml

