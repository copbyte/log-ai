server:
  port: 8083

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username: your-email@gmail.com
    password: your-email-password
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
  notification:
    email:
      enabled: true
      recipients: recipient-email@example.com
      subject-prefix: "[LOG-MONITOR]"
  application:
    name: alert-service
  datasource:
    url: jdbc:mysql://localhost:3306/log_monitor?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "123456"
  rabbitmq:
    host: localhost
    port: 5672
    username: admin
    password: admin
    listener:
      simple:
        acknowledge-mode: manual
        # 每次只预取1条消息，保证消息处理的公平性
        prefetch: 50
        retry:
          # 启用Spring Retry拦截器，由容器层面处理重试，消费者只需关注业务逻辑
          enabled: true
          # 最多重试3次
          max-attempts: 3
          # 首次重试间隔1秒，后续按2倍递增（1s → 2s → 4s），最大间隔10秒
          initial-interval: 1000ms
          max-interval: 10000ms
          multiplier: 2

# MQ消费控制配置
mq:
  consumer:
    ai:
      enabled: true  # 设置为false时禁用真实AI分析消费
      fake-consume: false  # 设置为true时启用假消费模式
    alert:
      enabled: true  # 设置为false时禁用真实告警消费
      fake-consume: false  # 设置为true时启用假消费模式

mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  global-config:
    db-config:
      id-type: auto
      table-underline: true
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

logging:
  level:
    com.logmonitor: info